<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Step 11 – Walkable Space (PC + VR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A-Frame core -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Extras: movement-controls (keyboard + VR gamepad) & laser-controls -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@latest/dist/aframe-extras.min.js"></script>
  <style>body{margin:0;background:#000}</style>
</head>
<body>
  <a-scene renderer="antialias: true">

    <!-- Assets: gradient sky as inline SVG (horizon gray → sky blue) -->
    <a-assets>
      <img id="skygrad" crossorigin="anonymous"
           src="data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='2' height='2'>\
<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'>\
<stop offset='0%' stop-color='%239fc9ff'/>\
<stop offset='65%' stop-color='%23cfe6ff'/>\
<stop offset='100%' stop-color='%23d8dbe0'/>\
</linearGradient></defs>\
<rect width='100%' height='100%' fill='url(%23g)'/></svg>">
    </a-assets>

    <!-- Soft lighting (simple & cheap) -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0 6 -3"></a-entity>

    <!-- Gradient background sky -->
    <a-sky src="#skygrad" rotation="0 0 0"></a-sky>

    <!-- RIG: keyboard on PC + thumbstick in VR; mouse look on desktop -->
    <a-entity id="rig" position="0 1.6 0" movement-controls="controls: gamepad,keyboard; speed: 0.22">
      <a-entity id="camera" camera look-controls></a-entity>
      <a-entity laser-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- Optional mouse cursor for clicking things (not required to move) -->
    <a-entity cursor="rayOrigin: mouse"></a-entity>

    <!-- Floor: big plane with subtle grid to give motion cues -->
    <a-plane rotation="-90 0 0" width="60" height="60" position="0 0 -15"
             material="color: #e3e6ea; metalness: 0; roughness: 1; repeat: 60 60;
                       src: data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'>\
<rect width='20' height='20' fill='%23e3e6ea'/>\
<path d='M0 0H20 M0 10H20 M0 20H20 M0 0V20 M10 0V20 M20 0V20' \
stroke='%22%238c99a5%22' stroke-width='0.3' opacity='0.25'/>\
</svg>">
    </a-plane>

    <!-- Minimal “corridor / room” using stretched boxes -->
    <!-- Start area -->
    <a-box position="0 1 -2" depth="0.2" height="2" width="4" color="#b8c4d1"></a-box>
    <!-- Left wall -->
    <a-box position="-2 1 -10" depth="20" height="2" width="0.2" color="#b8c4d1"></a-box>
    <!-- Right wall -->
    <a-box position="2 1 -10" depth="20" height="2" width="0.2" color="#b8c4d1"></a-box>
    <!-- Mid obstacle -->
    <a-box position="0 0.75 -10" depth="0.5" height="1.5" width="1.5" color="#9fb3c8"></a-box>
    <!-- Small turn (right) -->
    <a-box position="4 1 -18" depth="6" height="2" width="0.2" rotation="0 90 0" color="#b8c4d1"></a-box>
    <!-- Exit panel -->
    <a-plane position="6 1.5 -18" rotation="0 -90 0" width="2.5" height="2"
             material="color: #59d390"></a-plane>
    <a-text value="EXIT" position="5.85 1.5 -18" rotation="0 -90 0"
            align="center" width="4" color="#073b22"></a-text>

    <!-- A few props along the path to “guide” navigation -->
    <a-sphere position="0 1 -6" radius="0.35" color="#ff6a6a"></a-sphere>
    <a-box position="-1 0.75 -12" depth="0.8" height="1.5" width="0.8" color="#6aa0ff"></a-box>
    <a-cone position="1.2 1 -15" radius-bottom="0.6" height="1.2" color="#ff8de1"></a-cone>

  </a-scene>
</body>
</html>
